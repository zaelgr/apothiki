<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Online Inventory - Live Edition</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: var(--bg); }
        
        header { 
            padding: 15px 30px; background: white; border-bottom: 4px solid var(--primary); 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); min-height: 110px;
        }

        .header-left { flex: 1; display: flex; justify-content: flex-start; }
        .photo-box { width: 120px; height: 90px; border: 2px dashed #ccc; background: #f9f9f9; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; color: #999; }
        .photo-box img { max-height: 100%; width: auto; }

        .header-center { flex: 2; text-align: center; }
        .header-center h1 { margin: 0; color: var(--primary); font-size: 28px; text-transform: uppercase; }

        .header-right { flex: 1; text-align: right; font-size: 13px; color: #333; line-height: 1.4; }

        .wrapper { display: flex; flex: 1; overflow: hidden; }
        aside { width: 280px; border-right: 1px solid #ddd; background: #fff; overflow-y: auto; padding: 20px; }
        main { flex: 1; padding: 25px; overflow-y: auto; }
        
        .tree-node { margin-left: 10px; }
        .tree-header { cursor: pointer; padding: 5px; border-radius: 4px; transition: 0.2s; font-size: 14px; }
        .tree-header:hover { background: #f0f0f0; }
        .tree-header.active { background: var(--accent); color: white; }
        .children { display: none; margin-left: 15px; }
        .children.open { display: block; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; position: sticky; top: 0; font-size: 13px; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: middle; }
        tr:hover { background: #f1f4f6; }
        
        .prod-img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; cursor: zoom-in; }
        .search-bar { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }

        .id-text { font-family: monospace; font-weight: bold; color: #7f8c8d; }
        .sku-text { font-weight: bold; color: #e67e22; }
        .price-text { font-weight: bold; color: #27ae60; font-size: 16px; }

        .modal { display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; }
        .modal-content { max-width: 85%; max-height: 85%; border: 4px solid white; border-radius: 8px; }
    </style>
</head>
<body>

<div id="imageModal" class="modal" onclick="this.style.display='none'">
    <img class="modal-content" id="fullImage">
</div>

<header>
    <div class="header-left">
        <div class="photo-box">
            <img src="images/logo.png" alt="ΦΩΤΟ" onerror="this.style.display='none'; this.parentElement.innerHTML='ΕΔΩ Η<br>ΦΩΤΟΓΡΑΦΙΑ'">
        </div>
    </div>
    <div class="header-center">
        <h1>Η ΕΠΩΝΥΜΙΑ ΤΗΣ ΕΠΙΧΕΙΡΗΣΗΣ ΣΑΣ</h1>
        <div id="status" style="font-size: 14px; margin-top: 5px; color:#3498db;">🔄 Φόρτωση δεδομένων...</div>
    </div>
    <div class="header-right">
        <strong>Διεύθυνση:</strong> Οδός & Αριθμός, Πόλη<br>
        <strong>Τηλ:</strong> 210 0000000 | <strong>Κιν:</strong> 690 0000000<br>
        <strong>Email:</strong> info@yoursite.gr<br>
        <strong>Web:</strong> www.yoursite.gr
    </div>
</header>

<div class="wrapper">
    <aside>
        <h3 onclick="showAll()" style="cursor:pointer; font-size: 16px;">🏠 ΚΑΤΗΓΟΡΙΕΣ</h3>
        <hr style="margin: 10px 0; border:0; border-top: 1px solid #eee;">
        <div id="treeContainer"></div>
    </aside>

    <main>
        <input type="text" id="searchBox" class="search-bar" placeholder="Αναζήτηση σε Φωτό, ID, SKU ή Όνομα..." onkeyup="search()">
        <table id="inventoryTable">
            <thead>
                <tr>
                    <th width="60">Φωτό</th>
                    <th width="80">ID</th>
                    <th width="100">SKU</th>
                    <th>Όνομα / Περιγραφή</th>
                    <th width="80">Ποσότητα</th>
                    <th width="100">Τιμή (€)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" style="text-align:center; padding:50px; color:gray;">Παρακαλώ περιμένετε, τα δεδομένα φορτώνονται...</td></tr>
            </tbody>
        </table>
    </main>
</div>

<script>
    let rawData = [];

    // ΑΥΤΟΜΑΤΗ ΦΟΡΤΩΣΗ ΜΕ ΤΟ ΠΟΥ ΑΝΟΙΓΕΙ Η ΣΕΛΙΔΑ
    window.onload = function() {
        fetch('apothiki_site.csv')
            .then(response => {
                if (!response.ok) throw new Error("Το αρχείο CSV δεν βρέθηκε στον server.");
                return response.text();
            })
            .then(text => {
                processData(text);
                document.getElementById('status').innerText = "🟢 LIVE: " + rawData.length + " ΥΛΙΚΑ";
                document.getElementById('status').style.color = "#27ae60";
            })
            .catch(error => {
                document.getElementById('status').innerText = "🔴 ΣΦΑΛΜΑ: " + error.message;
                document.getElementById('status').style.color = "#e74c3c";
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" style="text-align:center; color:red; padding:20px;">Σφάλμα! Βεβαιωθείτε ότι το 'apothiki_site.csv' βρίσκεται στον ίδιο φάκελο με το index.html.</td></tr>`;
            });
    };

    function processData(text) {
        const lines = text.split('\n');
        rawData = lines.slice(1).map(line => {
            const c = line.split(',');
            if (c.length < 6) return null;
            return {
                img:      c[0]?.trim() || "",
                id:       c[1]?.trim() || "",
                sku:      c[2]?.trim() || "---",
                name:     c[3]?.trim() || "Unknown",
                qty:      c[4]?.trim() || "0",
                price:    c[5]?.trim() || "0.00",
                category: c[6]?.trim() || "Γενικά"
            };
        }).filter(r => r && r.name);
        
        buildTree();
        renderTable(rawData);
    }

    function renderTable(data) {
        const body = document.getElementById('tableBody');
        body.innerHTML = data.map(r => {
            const imgSrc = r.img && r.img !== "no-image.png" ? `images/${r.img}` : `https://via.placeholder.com/50?text=No+Img`;
            return `<tr>
                <td><img src="${imgSrc}" class="prod-img" onclick="openLightbox('${imgSrc}')" onerror="this.src='https://via.placeholder.com/50?text=No+Img'"></td>
                <td class="id-text">${r.id}</td>
                <td class="sku-text">${r.sku}</td>
                <td><strong>${r.name}</strong></td>
                <td style="text-align:center; font-weight:bold;">${r.qty}</td>
                <td class="price-text">${r.price} €</td>
            </tr>`;
        }).join('');
    }

    function buildTree() {
        const container = document.getElementById('treeContainer');
        const tree = {};
        rawData.forEach(item => {
            const parts = item.category.split(' > ');
            let current = tree;
            parts.forEach(part => {
                if (!current[part]) current[part] = { _sub: {} };
                current = current[part]._sub;
            });
        });
        container.innerHTML = "";
        renderNodes(tree, container, "");
    }

    function renderNodes(node, parentElement, fullPath) {
        Object.keys(node).sort().forEach(key => {
            const path = fullPath ? `${fullPath} > ${key}` : key;
            const div = document.createElement('div');
            div.className = 'tree-node';
            const header = document.createElement('div');
            header.className = 'tree-header';
            header.innerHTML = `▶ 📂 ${key}`;
            const childrenDiv = document.createElement('div');
            childrenDiv.className = 'children';
            header.onclick = (e) => {
                e.stopPropagation();
                const isOpen = childrenDiv.classList.toggle('open');
                header.innerHTML = (isOpen ? "▼" : "▶") + " 📂 " + key;
                filterByCategory(path);
                document.querySelectorAll('.tree-header').forEach(h => h.classList.remove('active'));
                header.classList.add('active');
            };
            div.appendChild(header);
            div.appendChild(childrenDiv);
            parentElement.appendChild(div);
            renderNodes(node[key]._sub, childrenDiv, path);
        });
    }

    function openLightbox(src) {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('fullImage');
        modal.style.display = "flex";
        modalImg.src = src;
    }

    function filterByCategory(path) {
        const filtered = rawData.filter(item => item.category.startsWith(path));
        renderTable(filtered);
    }

    function showAll() { 
        renderTable(rawData); 
        document.querySelectorAll('.tree-header').forEach(h => h.classList.remove('active')); 
    }

    function search() {
        const term = document.getElementById('searchBox').value.toLowerCase();
        const filtered = rawData.filter(r => 
            r.name.toLowerCase().includes(term) || 
            r.id.toLowerCase().includes(term) || 
            r.sku.toLowerCase().includes(term)
        );
        renderTable(filtered);
    }
</script>
</body>
</html>
